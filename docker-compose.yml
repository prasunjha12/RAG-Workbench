services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_workbench
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_workbench"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag_workbench
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: ["uploads:/app/uploads"]
  web:
    build: ./frontend
    environment: { VITE_API_URL: "http://localhost:8000/api" }
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  uploads:
